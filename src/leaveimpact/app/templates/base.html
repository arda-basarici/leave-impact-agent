<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Leave Impact Agent{% endblock %}</title>
<style>
  :root { --ink: #1f2933; --muted: #52606d; --rule: #d9dee3; --navy: #1b3a5c; }
  body { margin: 0; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 72ch; margin: 2rem auto; }
  h1 { color: var(--navy); font-size: 1.6rem; margin-bottom: .25rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  footer { margin-top: 2rem; padding-top: .75rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; }
  .meta { color: var(--muted); font-size: .9rem; }
  ul.replays { padding-left: 0; list-style: none; }
  ul.replays li { padding: .5rem 0; border-bottom: 1px solid var(--rule); }
  ul.replays .meta { display: block; }
  h2 { font-size: 1.2rem; margin: 1.5rem 0 .5rem; }
  h4 { margin: .75rem 0 .25rem; color: var(--muted); font-weight: 600; }
  .banner { border-left: 4px solid #b45309; background: #fff7ed; padding: .5rem .75rem; margin: 1rem 0; }
  .banner.defect { border-left-color: #b91c1c; background: #fef2f2; }
  .ending { border: 1px solid var(--rule); padding: .75rem 1rem; margin: 1rem 0; }
  .ending h2 { margin-top: 0; }
  .claim { border-top: 1px solid var(--rule); padding: .75rem 0; }
  .claim .sentence { margin: 0 0 .5rem; }
  .nested { margin-left: 1.25rem; }
  .evidence { background: #f8fafc; border: 1px solid var(--rule); border-radius: 4px; padding: .5rem .75rem; margin: .5rem 0; font-size: .92rem; }
  .evidence .cited { font-weight: 600; }
  .evidence blockquote { margin: .5rem 0; padding-left: .75rem; border-left: 3px solid var(--rule); white-space: pre-wrap; }
  mark { background: #fde68a; }
  .label { display: inline-block; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .rationale { border-left: 3px solid #94a3b8; padding: .25rem .75rem; margin: .5rem 0; }
  ol.timeline { padding-left: 0; list-style: none; }
  ol.timeline li { padding: .5rem 0; border-top: 1px solid var(--rule); }
  ol.timeline .when { display: block; color: var(--muted); font-size: .85rem; font-family: ui-monospace, monospace; }
  table.caps { border-collapse: collapse; }
  table.caps td, table.caps th { padding: .2rem .75rem .2rem 0; text-align: left; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>Leave Impact Agent · revision {{ code_version }}</footer>
</main>
</body>
</html>
