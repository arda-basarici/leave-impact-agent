[project]
name = "leaveimpact"
version = "0.1.0"
description = "Leave-impact investigation and coverage planning agent over real organizational tools."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pdoc",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.13.4",
    "ruff",
    "vcrpy>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

# Lint only — no formatter. Code is hand-formatted and reviewed; a formatter's
# rewrites would churn diffs without carrying intent (SteamLens precedent).
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["probes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Strict over the package and its tests; probes and scripts stay outside so a
# throwaway spike never has to satisfy the production type bar.
[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# Doctests are the caller's contract and run with the suite. Levels are markers
# (DESIGN: "Verification"): the default run is the unit level; `integration`
# (agent-smoke tests included — they write the real event log) needs the
# PostgreSQL service, `live` and `e2e` need quota or a deployment. `just test-integration`
# and `just test-all` select the rest. Coverage is a separate recipe, never a gate.
# Network access is blocked for every test (tests/recording.py explains the guard);
# only a vcr-marked test under a record mode reaches a sandbox (`just test-record`).
[tool.pytest.ini_options]
addopts = "--doctest-modules --strict-markers --block-network --allowed-hosts=localhost,127.0.0.1,postgres -m 'not integration and not live and not e2e'"
testpaths = ["src", "tests"]
markers = [
    "integration: needs real dependencies (the PostgreSQL service, recorded cassettes)",
    "live: can only run against a real external sandbox (no cassette possible); the cassette re-record is a record mode, not this marker",
    "e2e: runs against a deployment through its public hostname",
]
