name: CI

# The authority for "is this commit good": the same gate `just check` runs locally
# (lint, types, unit + doctests, docs build), plus the integration level against a
# real PostgreSQL service. On a green main push the image job builds the deploy
# unit for both platforms and pushes it to GHCR. The deploy job attaches when the
# OIDC deploy (probe `oidc-deploy`) lands, behind the `production` environment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The integration level runs against the store it ships with — PostgreSQL, never
    # a SQLite stand-in (DESIGN: "Verification"). Declared from the first commit so
    # the wiring exists before the first test needs it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaveimpact
          POSTGRES_PASSWORD: leaveimpact
          POSTGRES_DB: leaveimpact_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leaveimpact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://leaveimpact:leaveimpact@localhost:5432/leaveimpact_test

    steps:
      - uses: actions/checkout@v7.0.1

      # Exact tag: setup-uv publishes no floating major tags — bumps are deliberate
      # edits, not drift.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Pyright (types, strict)
        run: uv run pyright

      - name: Pytest (unit, doctests)
        run: uv run pytest -q

      - name: Pytest (integration, against the PostgreSQL service)
        run: uv run pytest -q -m integration

      # A broken docstring breaks the build — the reference is generated, never edited.
      - name: Docs build (pdoc)
        run: uv run python scripts/regen_docs.py

  image:
    # Push-to-main only: PRs get checked, never published. `needs: check` is
    # load-bearing — the instance only ever runs an image that passed CI, so a
    # red commit must never mint a `latest`.
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.stamp.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      # The provenance stamp the Dockerfile refuses to build without — the same
      # short-sha identity laptop builds mint from their working tree.
      - name: Mint the code-version stamp
        id: stamp
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # arm64 is the instance (Graviton); amd64 is the workstation. One manifest,
      # both platforms — QEMU emulates the foreign one on the amd64 runner, a
      # cost this small image can carry.
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged latest + sha: the instance tracks latest; rollback is pointing the
      # compose file at the previous sha tag.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            CODE_VERSION=${{ steps.stamp.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.stamp.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
