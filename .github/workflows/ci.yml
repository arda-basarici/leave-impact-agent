name: CI

# The authority for "is this commit good": the same gate `just check` runs locally
# (lint, types, unit + doctests, docs build), plus the integration level against a
# real PostgreSQL service. On a green main push the image job builds the deploy
# unit for both platforms and pushes it to GHCR; the deploy job then waits behind
# the `production` environment's reviewer gate and, once approved, lands that
# exact commit on the instance over SSM with OIDC-federated credentials.
#
# The image waits on `check` alone (DESIGN, "Verification", the first live run's
# close): the generator's slow sweeps and the crash matrix are jobs of their own
# that run on every push and gate nothing. The sweeps test the generator, whose
# product reaches the instance only through the validator's verdict and the serving
# rule, never through the image; the matrix tests the worker the image ships, and
# its detachment is a stated development tradeoff, the matrix being the longest job
# (14:30 against the gate's 9:50 on run 38453066430, attempt 1, of `a7f1d22`, read
# 2026-10-13 off the Actions API with `gh run view 38453066430 --json jobs`; the
# check job's own stages and the whole pipeline are in DESIGN). A deploy approved before
# the matrix ended is provisional; a red matrix on a deployed commit is an incident
# before the next live run. The measurement world's dispatch guard, at the freeze,
# requires every named job of the deployed sha's run green.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # The integration level runs against the store it ships with — PostgreSQL, never
    # a SQLite stand-in (DESIGN: "Verification"). Declared from the first commit so
    # the wiring exists before the first test needs it. The image is this repository's
    # GHCR mirror of the Docker Hub library at the library's own digest, pulled with the
    # workflow token, as the Dockerfile's base is: the runner pool's anonymous quota
    # failed CI closed on Docker Hub and then on the public ECR mirror
    # (mirror-base-images.yml).
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/arda-basarici/leave-impact-agent/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: leaveimpact
          POSTGRES_PASSWORD: leaveimpact
          POSTGRES_DB: leaveimpact_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leaveimpact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://leaveimpact:leaveimpact@localhost:5432/leaveimpact_test

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Exact action tag: setup-uv publishes no floating majors — bumps are
      # deliberate edits, not drift. The uv version is the one that wrote uv.lock
      # (and the one the Dockerfile copies in): a lockfile only reproduces when the
      # resolver replaying it matches.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked --group report

      # Secrets: the pre-commit hook only runs where someone ran `just hooks`, so CI
      # is the gate that cannot be skipped. Full history, not just the diff — a secret
      # pushed past a hook is still in the commits behind it.
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITLEAKS_ENABLE_SUMMARY: "false"
          # The same gitleaks the pre-commit hook pins (.pre-commit-config.yaml), so a
          # config the hook accepts is the config this step runs: the action's own
          # default (8.24.3) read the first `.gitleaks.toml` differently from the hook's
          # 8.30.1 and refused a push the hook had passed (2026-10-23).
          GITLEAKS_VERSION: "8.30.1"
          # The action looks the repo owner up to decide whether a license applies;
          # without a token that call is unauthenticated from the runner's shared IP
          # and, rate-limited, fails closed as "missing license" (2026-09-16). The
          # workflow token is read-only here and authenticates only that lookup.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ruff (lint)
        run: uv run ruff check

      # The two lifecycle scripts the workflows send to the host (and the deploy's), on
      # the runner image's own shellcheck: the laptop has none and gains no dependency.
      - name: Shellcheck (the host and runner scripts)
        run: shellcheck deploy/instance/*.sh deploy/runner/*.sh

      - name: Pyright (types, strict)
        run: uv run pyright

      # In parallel, one worker per core, a test file kept whole on one worker: many
      # files build one expensive module-scoped fixture (a loaded world), and spreading a
      # file's tests would rebuild it on every worker that got one.
      - name: Pytest (unit level, doctests)
        run: uv run pytest -q -n auto --dist loadfile

      - name: Pytest (integration, against the PostgreSQL service)
        run: uv run pytest -q -m integration

      # The reference is generated, never edited; an import error in any module
      # fails this step (doctests, above, are what catch broken examples).
      - name: Docs build (pdoc)
        run: uv run python scripts/regen_docs.py

  # The slow sweeps, twenty seeds per generator invariant, detached from the gate at the
  # first live run's close (the header above): two unit files, no service, in parallel.
  sweeps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true

      # The report group too, as the check job: `-m slow` deselects after collection, so
      # every test module in the tree is imported here, and the report tests import
      # reportlab at module level (two collection errors on the first run after the
      # report skeleton, 2026-10-20).
      - name: Sync the locked environment
        run: uv sync --locked --group report

      - name: Pytest (the slow sweeps, twenty seeds per generator invariant)
        run: uv run pytest -q -n auto -m slow

  # The crash matrix (the event log step's ruling on placement and acceptance, part 8): the
  # worker killed at every named crossing of its reference run in child processes and
  # recovered, against the same PostgreSQL service, under its own marker so the check job's
  # minutes stay its own, and since the first live run's close not in the image's `needs`
  # (the header above). `tests/crash/MANIFEST.md` holds the kill points and forecasts.
  crash-matrix:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/arda-basarici/leave-impact-agent/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: leaveimpact
          POSTGRES_PASSWORD: leaveimpact
          POSTGRES_DB: leaveimpact_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leaveimpact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://leaveimpact:leaveimpact@localhost:5432/leaveimpact_test

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Pytest (the crash matrix, against the PostgreSQL service)
        run: uv run pytest -q -m crash tests/crash

  image:
    # Push-to-main only: PRs get checked, never published. `needs: check` is
    # load-bearing — the instance only ever runs an image that passed the gate, so a
    # red commit must never mint a `latest`; the sweeps and the matrix run beside it
    # (the header above).
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.stamp.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    # Every action below is pinned by full commit SHA (the tag beside it): `packages:
    # write` is a job-level permission, and a moved tag would publish under it (the M1
    # audit's F-010). The check job still rides tags; it publishes nothing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The registration's commit below is a log walk, and on a depth-one clone
          # `git log -1 -- <file>` answers HEAD for any file present.
          fetch-depth: 0

      # The provenance stamp the Dockerfile refuses to build without: the full sha,
      # since the agent's commands read the image's code version as the forty-hex
      # commit they run as and refuse anything else (the event log step's review).
      # The short form is minted beside it for the human-readable tag alone. The
      # registration's commit is minted the way the investigate workflow's runner
      # computes it, so a visitor's run the demo plans and an operator's run of the
      # same cell freeze one commit (the live-path commands step, group 4).
      - name: Mint the code-version stamp
        id: stamp
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short HEAD)"
            echo "registration_commit=$(git log -1 --format=%H -- preregistration/registration.json)"
          } >> "$GITHUB_OUTPUT"

      # arm64 is the instance (Graviton); amd64 is the workstation. One manifest,
      # both platforms — QEMU emulates the foreign one on the amd64 runner, a
      # cost this small image can carry.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged latest + short sha + full sha: the instance tracks latest; rollback
      # is pointing the compose file at a sha tag (the full one is the label the
      # deploy names; the short one is for humans). A tag is a label the registry
      # can move; the manifest digest recorded below is the image's identity.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            CODE_VERSION=${{ steps.stamp.outputs.sha }}
            REGISTRATION_COMMIT=${{ steps.stamp.outputs.registration_commit }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.stamp.outputs.short }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke (the first live run's step, fork 8): the image just pushed, pulled back by
      # its digest and run once on the runner's own platform, loads both roles' prompt
      # assets through the loader the work command composes with and prints their digests
      # beside the code version; a prompt file the packaging dropped fails the job here,
      # before any deploy. The identity line is a command since the demo milestone's
      # scaffold step (serving is the default), and the deploy runs it as its image check.
      - name: Smoke the built image
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            python -m leaveimpact smoke | tee smoke.txt
          grep -qx "code_version=${{ steps.stamp.outputs.sha }}" smoke.txt
          grep -q '^investigator\.' smoke.txt && grep -q '^reader\.' smoke.txt
          grep -q '^results\.m2-reported\.json=' smoke.txt
          grep -q '^demo\.demo\.json=' smoke.txt

      # The log then says which bytes a sha tag pointed at when it was built, since the
      # tag itself cannot; the deploy job below carries the same digest to the host, which
      # pulls by it (the freeze step, fork 10 with fork 32's split; the M1 audit's F-010 in
      # part, the base-image pins still to come); the smoke above is the final-image check
      # the same finding asked for.
      - name: Record the image digest
        run: |
          {
            echo "image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # The approval gate: `production` carries a required reviewer, so the job
    # waits at "Review pending" until a human clicks. Credentials are federated
    # (OIDC → the deploy role owned by the platform repository, in its
    # `terraform/stacks/leave-impact-prod/deploy.tf`), so the repository stores no
    # AWS key; the environment's branch policy pins this to main on GitHub's side.
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    # The three actions below are pinned by full commit SHA: `id-token: write` is
    # job-level, so any action here could mint the token the deploy role trusts.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Probe evidence (`oidc-deploy`): the subject the token really carries is
      # what the role's trust condition must match. Logged, never assumed.
      - name: Record the OIDC subject
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub=${claims.sub}`);
            core.info(`aud=${claims.aud} repository_id=${claims.repository_id} ref=${claims.ref}`);
            await core.summary.addHeading('OIDC subject').addCodeBlock(claims.sub).write();

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::445743457479:role/leave-agent-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The host is found by tag, not id, so a replaced instance deploys without
      # a workflow edit. The script travels inside the command payload — nothing
      # is fetched from anywhere the host could be lied to by.
      - name: Deploy to the app host
        env:
          # The manifest digest the image job recorded: the host pulls the image by it.
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST" || { echo "the image job recorded no digest"; exit 1; }
          IID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=leave-agent-app Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          test -n "$IID" || { echo "no running leave-agent-app instance"; exit 1; }
          # One command carries the deploy and, after it, the boundary probe: the truth
          # bucket unreachable from the instance role, the public evidence of the sealed
          # answer key (ruling 1 of the step 12 interview). A failed probe fails this
          # step with no rollback — the app may be healthy while the boundary is not.
          jq -n --arg sha "$GITHUB_SHA" --arg digest "$IMAGE_DIGEST" \
            --rawfile script deploy/instance/deploy.sh \
            --rawfile probe deploy/instance/assert-truth-unreachable.sh \
            '{commands: ["export DEPLOY_SHA=\($sha)", "export DEPLOY_DIGEST=\($digest)", $script, $probe]}' > payload.json
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" --parameters file://payload.json \
            --query Command.CommandId --output text)
          echo "command $CID on $IID"
          aws ssm wait command-executed --command-id "$CID" --instance-id "$IID" || true
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json | tee result.json
          test "$(jq -r .Status result.json)" = Success
