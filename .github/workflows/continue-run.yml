# An attempt continued from its recorded state (the first live run's step, forks 1 and
# 10): dispatched by hand for two cases. A reviewer who has read the frozen payload with
# `review-approval` in a Session Manager session, where the run's content may be shown,
# types its digest here; the job delivers the approval, so an approval names what the
# human read, then continues. Or an attempt whose job ended after the attempt itself
# did (a failed publish, a runner lost after the closing): with no digest the job
# reads the state and takes the lifecycle from there, the publish and the inventory
# included. Both run deploy/runner/investigate.sh in MODE=continue under the policy
# the attempt was dispatched with (the step's batch review): the human policy reads
# an approval already given as approved and none requested as work; the automatic
# policy recovers a request a dead process left open instead of waiting for a human.
# The approver recorded is the dispatching account. The run, attempt, launch identity
# and policy are the earlier job's, printed in its log and summary. Same environment,
# same credentials, same pinning rule as the investigate workflow.
name: continue run
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: the attempt's run id (run-<workflow run id>)
        required: true
        type: string
      attempt:
        description: the attempt's number
        required: true
        type: string
      launch:
        description: the launch identity the earlier job printed (launch=…)
        required: true
        type: string
      payload_digest:
        description: the 64-hex digest review-approval printed for the payload you read; empty to continue without delivering an approval
        required: false
        type: string
        default: ""
      approval:
        description: the approval policy the attempt was dispatched under
        required: true
        type: choice
        options: [automatic, human]
permissions: {}

concurrency:
  group: instance-lifecycle
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      # The driver reads the CI run of the dispatched commit off the Actions API before
      # any send (the freeze step, fork 10).
      actions: read
    env:
      AWS_REGION: eu-central-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record the OIDC subject
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub=${claims.sub}`);
            core.info(`aud=${claims.aud} repository_id=${claims.repository_id} ref=${claims.ref}`);
            await core.summary.addHeading('OIDC subject').addCodeBlock(claims.sub).write();

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::445743457479:role/leave-agent-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Continue the lifecycle on the app host
        env:
          MODE: continue
          LEDGER: ledger-development
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_ATTEMPT: ${{ inputs.attempt }}
          INPUT_LAUNCH: ${{ inputs.launch }}
          INPUT_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          INPUT_APPROVAL: ${{ inputs.approval }}
        run: bash deploy/runner/investigate.sh
