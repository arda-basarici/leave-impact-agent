# Throwaway. Observes the SDK shape of every conditional-write outcome under the
# generator role (probes/objectstore/probe.py states the criterion), so the S3 store's
# three-outcome contract is written against observed values. Also logs the token's
# workflow claims, which the trust-hardening note of 2026-09-13 needs observed once.
# Deleted once the run is recorded in probes/FINDINGS.md.
name: objectstore probe
on: workflow_dispatch
permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: benchmark
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-central-1
      WORLD_BUCKET: leave-impact-world-445743457479
    steps:
      - name: Record the OIDC subject and the workflow claims
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(`sub=${claims.sub}`);
            core.info(`aud=${claims.aud} repository_id=${claims.repository_id} ref=${claims.ref}`);
            core.info(`workflow=${claims.workflow}`);
            core.info(`workflow_ref=${claims.workflow_ref}`);
            core.info(`job_workflow_ref=${claims.job_workflow_ref}`);
            await core.summary.addHeading('OIDC subject').addCodeBlock(claims.sub).write();

      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Assume the generator role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::445743457479:role/leave-agent-generator
          aws-region: ${{ env.AWS_REGION }}

      - name: The conditional-write shapes
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query Arn --output text | tee identity.txt
          grep -q 'assumed-role/leave-agent-generator/' identity.txt
          uv run python probes/objectstore/probe.py
