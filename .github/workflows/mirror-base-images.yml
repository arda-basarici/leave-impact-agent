# Mirrors the two base images CI and the instance pull (the Dockerfile's python, the
# PostgreSQL service in ci.yml and compose.yaml) into this repository's own GHCR
# namespace, by digest. The shared GitHub runner pool's anonymous pull quota failed CI
# closed on Docker Hub twice (2026-10-10) and on the public ECR mirror of the library
# four times (2026-10-14), and since the freeze's dispatch guard a red CI attempt
# blocks the measurement runs until a re-run by hand. A pull from GHCR rides the workflow
# token in CI and GitHub's own registry on the host, no third-party quota and no secret.
#
# The copy preserves the upstream index digest, so the digest pinned at every pull site
# is Docker Hub's own, checkable by anyone against the library. A bump is three edits:
# the digest below, a run of this workflow, the digests at the five pull sites.
#
# Runs on demand and whenever this file changes on main. The bootstrap branch is listed
# because a `workflow_dispatch` needs the file on the default branch, and the first copy
# had to exist before the commit that points the pull sites at it reached main: the
# commit was pushed to that branch, its push ran this workflow, and main fast-forwarded
# to the same commit (one commit, CI green on the exact sha). The name stays as the record.
name: mirror-base-images

on:
  workflow_dispatch:
  push:
    branches: [main, bootstrap-mirror]
    paths:
      - .github/workflows/mirror-base-images.yml

permissions: {}

env:
  # The upstream index digests, read off the library on 2026-10-10
  # and again on 2026-10-15. The tag is the human label the mirror is written under and
  # the digest is the identity the copy reads; skopeo refuses a reference carrying both
  # (probed on 1.22.3), so they are held apart here and joined only at the pull sites.
  PYTHON_TAG: 3.13-slim-bookworm
  PYTHON_DIGEST: sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
  POSTGRES_TAG: 16-alpine
  POSTGRES_DIGEST: sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  MIRROR: ghcr.io/${{ github.repository }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # The runner image supplies skopeo unpinned; the log names the version each copy
      # was made with.
      - name: Name the copier
        run: skopeo --version

      - name: Log in to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--all` copies every platform of the index and `--preserve-digests` refuses a copy
      # that would change one; the destination's index digest (the top-level `Digest` of
      # `skopeo inspect`, probed equal to the raw bytes' sha256) is then compared with the
      # pinned one, so the pins at the pull sites are proven to name the mirrored bytes
      # before any site points at them. The source pull is this workflow's one anonymous
      # Docker Hub read; refused by the quota, the run is repeated.
      - name: Copy the two images by digest
        run: |
          set -euo pipefail
          copy() {
            local name=$1 tag=$2 digest=$3
            local destination="$MIRROR/$name:$tag"
            skopeo copy --all --preserve-digests "docker://docker.io/library/$name@$digest" "docker://$destination"
            local mirrored
            mirrored=$(skopeo inspect "docker://$destination" | jq -r .Digest)
            [ "$mirrored" = "$digest" ] || {
              echo "$destination carries $mirrored where $digest was pinned"; exit 1
            }
            echo "$destination@$digest"
            echo "MIRRORED_$name=$destination" >> "$GITHUB_ENV"
          }
          copy python "$PYTHON_TAG" "$PYTHON_DIGEST"
          copy postgres "$POSTGRES_TAG" "$POSTGRES_DIGEST"

      # The instance pulls with no registry login, so each package must read anonymously;
      # the runner is logged in, and `--no-creds` makes the read the host's. A package
      # first published by the workflow token can land private: this step then fails, the
      # package's visibility is set to public in its settings by hand, and the run is
      # repeated.
      - name: Check the packages read anonymously
        run: |
          set -euo pipefail
          for destination in "$MIRRORED_python" "$MIRRORED_postgres"; do
            skopeo inspect --no-creds --raw "docker://$destination" > /dev/null || {
              echo "$destination is not readable anonymously; set the package public and re-run"; exit 1
            }
            echo "$destination reads anonymously"
          done
