# The instance shape (DESIGN, "The application host"): the application and its
# PostgreSQL as one Compose stack. The app runs the image CI published — no
# `build:` here, so the 2 GB instance can never become a build server. The proxy
# that terminates TLS behind Cloudflare owns the shared `web` network and lands
# with the instance probe; the app joins it and publishes nothing to the host.
# Local development layers compose.dev.yaml on top.
name: leaveimpact

services:
  app:
    # The deploy script pins APP_TAG to the commit sha it lands; a laptop rehearsal
    # without one follows `latest`. Rollback = an older sha.
    image: ghcr.io/arda-basarici/leave-impact-agent:${APP_TAG:-latest}
    # Values interpolate from the process environment — no .env, no `env_file`:
    # the app gets exactly the variables named here. Locally they are user
    # environment variables (never a file in the tree); on the instance the deploy
    # step reads SSM Parameter Store and exports them for `compose up`, never
    # rendering a file to disk.
    environment:
      DATABASE_URL: postgresql://leaveimpact:${POSTGRES_PASSWORD:?set in the environment}@postgres:5432/leaveimpact
      # The world bucket and its region, for the corpus cache loader; the instance role's
      # credentials come from the instance metadata service, never from here. The truth
      # bucket is never named to the application (DESIGN, "Keeping the benchmark out of
      # the product"). Empty on a laptop that fills its cache from a local twin.
      LEAVE_IMPACT_WORLD_BUCKET: ${LEAVE_IMPACT_WORLD_BUCKET:-}
      LEAVE_IMPACT_AWS_REGION: ${LEAVE_IMPACT_AWS_REGION:-}
      LEAVE_IMPACT_OBJECT_STORE_ROOT: ${LEAVE_IMPACT_OBJECT_STORE_ROOT:-}
      # The investigator's vendor principals are the worker service's alone (below): the
      # web process reads no vendor, and a public-facing process holding reader
      # credentials it never uses is an exposure the file refuses by construction;
      # tests/unit/test_compose_edge.py holds every vendor name off this block.
      # The proxy's subnet, from which the client address in the forwarded headers is
      # trusted: Uvicorn reads this name from the environment when no flag names it,
      # and the start route's per-address window counts the address it yields (the
      # live-path commands step, fork 8). The value is the platform contract's `web`
      # subnet row (platform/projects/leave-impact/README.md, row 27), a constant of the
      # contract and not a parameter the deploy reads, so it is the literal here;
      # tests/unit/test_compose_edge.py holds it to the row's value.
      FORWARDED_ALLOW_IPS: 172.18.0.0/16
    # The service since the demo milestone's scaffold step: restarted on exit unless
    # stopped by hand, so a crash comes back and a deploy's stop stays stopped. The
    # restart policy governs container exits only; an unhealthy readiness below is a
    # signal to the deploy (`up --wait`) and to the platform's monitor, never a repair,
    # since Docker restarts no container for failing its health check.
    restart: unless-stopped
    # The readiness route from inside the container with Python's own client (the slim
    # image carries no curl): 200 only when the store answers, the cache serves the
    # allowlisted world and the app schema is at the code's version, so `up --wait`
    # returns when the demo can be served and the deploy's readiness check reads the same
    # route. A 503 raises in urlopen and exits 1. The route makes two bounded reads
    # (three seconds to connect and three per statement, each); the client's eight
    # seconds cover the normal path, and a probe that gives up on a blocked store reads
    # unhealthy exactly as a 503 would.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    # Three processes on a 2 GB instance: bound each so one cannot OOM the others;
    # rotate logs so a chatty event stream cannot fill the root volume. The limits are
    # the memory baseline's rule over the instance's reading (probes/memory-baseline:
    # 1.5 times the peak memory.current sampled under the demo's loads, rounded up to
    # 64 MiB); tests/unit/test_memory_baseline.py holds them to the committed reading,
    # so a change here starts with a new capture.
    mem_limit: 384m
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - store

  worker:
    # The worker service (ruling 4 of the demo milestone's entry; the worker service
    # step): the single-flight loop that runs a visitor's attempt, the sweeper's pass and
    # one attempt per tick, each attempt worked in a child this process supervises
    # (src/leaveimpact/app/worker.py). The same image as the app, never built here; the
    # lifecycle's `work` step runs its one-off container as this service, since it is
    # the one step that needs the vendor principals.
    image: ghcr.io/arda-basarici/leave-impact-agent:${APP_TAG:-latest}
    command: ["python", "-m", "leaveimpact.app", "worker"]
    environment:
      DATABASE_URL: postgresql://leaveimpact:${POSTGRES_PASSWORD:?set in the environment}@postgres:5432/leaveimpact
      LEAVE_IMPACT_WORLD_BUCKET: ${LEAVE_IMPACT_WORLD_BUCKET:-}
      LEAVE_IMPACT_AWS_REGION: ${LEAVE_IMPACT_AWS_REGION:-}
      LEAVE_IMPACT_OBJECT_STORE_ROOT: ${LEAVE_IMPACT_OBJECT_STORE_ROOT:-}
      # The investigator's read-only vendor principals (the platform contract's five
      # parameters under /leave-agent/) and the two base URLs (the demo configuration's
      # HR site and the tracker's gateway root, nonsecret constants), exported into the
      # environment by the deploy script for this service and by the lifecycle's work
      # step, the way the deploy exports the PostgreSQL password. Empty defaults, since
      # compose interpolates the whole file for every command and the other services'
      # one-off containers export none; the child refuses at its composition when a
      # name it needs is empty. The Google credential travels as the JSON value, never
      # a file (the worker service step, fork 2).
      LEAVE_IMPACT_FRAPPE_BASE_URL: ${LEAVE_IMPACT_FRAPPE_BASE_URL:-}
      LEAVE_IMPACT_FRAPPE_API_KEY: ${LEAVE_IMPACT_FRAPPE_API_KEY:-}
      LEAVE_IMPACT_FRAPPE_API_SECRET: ${LEAVE_IMPACT_FRAPPE_API_SECRET:-}
      LEAVE_IMPACT_JIRA_BASE_URL: ${LEAVE_IMPACT_JIRA_BASE_URL:-}
      LEAVE_IMPACT_JIRA_EMAIL: ${LEAVE_IMPACT_JIRA_EMAIL:-}
      LEAVE_IMPACT_JIRA_TOKEN: ${LEAVE_IMPACT_JIRA_TOKEN:-}
      LEAVE_IMPACT_GOOGLE_AUTHORIZED_USER_JSON: ${LEAVE_IMPACT_GOOGLE_AUTHORIZED_USER_JSON:-}
    # Restarted on exit unless stopped by hand, as the app: a crash comes back, a deploy's
    # stop stays stopped (and a failed deploy after the schema bootstraps leaves it so
    # until a deploy succeeds; the instance runbook names the state).
    restart: unless-stopped
    # Docker's stop sends the loop its signal and kills the container after this period.
    # The service's own chain under the signal is the child's terminate, the supervisor's
    # fixed ten-second grace, the kill and the reap (app/worker.py, `end_child`), measured
    # at 10.2 s in the grace case (probes/FINDINGS.md, worker-blocked, the rerun under the
    # child): ten seconds fixed plus 0.2 s of variable time. Fifteen leaves 4.8 s over the
    # measured variable part, and does not exceed the daemon's fifteen-second shutdown
    # cap, which a reboot's parallel stop runs under anyway and is ruled crash recovery
    # (the step's fork 9). The deploy's stop of this service is where the value is read
    # live, off the deploy log's phase stamps.
    stop_grace_period: 15s
    # The heartbeat's deadline against the clock (app/heartbeat.py): idle, three
    # intervals ahead and rewritten per tick; working, the claim plus the wall plus the
    # cleanup allowance; so a loop that stopped ticking and a child past its wall and its
    # cleanup both read unhealthy while an attempt lasting minutes reads healthy. The
    # module imports the standard library alone, so a check costs the interpreter's
    # start and not the worker's two seconds of imports (its test holds the import list).
    # The start period covers the start pass, which reads the stores after about three
    # seconds of imports; unhealthy is a signal to `up --wait` and the platform's
    # monitor, never a restart, as for the app.
    healthcheck:
      test: ["CMD", "python", "-m", "leaveimpact.app.heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # The memory baseline's reservation for this service (reading.json, the rule's
    # `worker_reservation_bytes`), provisional: the idle reading is this step's, the
    # reading under a public attempt is the live path's first acceptance, and the limits
    # are reset there by the rule; tests/unit/test_memory_baseline.py holds this to the
    # reservation and the three limits to the budget's sum.
    mem_limit: 512m
    logging: *log
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - store

  postgres:
    # The same mirrored image CI's service runs, at the same digest, read anonymously:
    # the host has no registry login (mirror-base-images.yml).
    image: ghcr.io/arda-basarici/leave-impact-agent/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: leaveimpact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the environment}
      POSTGRES_DB: leaveimpact
    # Data on the host disk — an absolute path from the environment so the instance pins it
    # to the gp3 volume and a laptop to wherever it likes. Owned by the container's
    # postgres uid; never copied live — the nightly pg_dump runs against the
    # service, this mount is for durability across rebuilds.
    volumes:
      - ${PGDATA_HOST:?absolute host path for PostgreSQL data, set in the environment}:/var/lib/postgresql/data
    mem_limit: 192m
    shm_size: 128m
    logging: *log
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveimpact -d leaveimpact"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - store

networks:
  # Owned by the proxy stack, shared across projects on the host — created once:
  # `docker network create web`.
  web:
    external: true
  # Private to this stack: PostgreSQL is reachable from the app only.
  store:
